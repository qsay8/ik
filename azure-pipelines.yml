pool:
  vmImage: 'macos-14'

steps:
- checkout: none

- bash: |
    set -euo pipefail

    echo "=== macOS information ==="
    uname -m
    sw_vers
    whoami

    echo "=== Install Python packages ==="
    python3 -m venv "$HOME/maccontrol-venv"
    source "$HOME/maccontrol-venv/bin/activate"
    python -m pip install --upgrade pip
    python -m pip install Flask pyobjc-framework-Quartz

    mkdir -p "$HOME/maccontrol"
    cd "$HOME/maccontrol"

    cat > server.py <<'PYTHON'
    import os
    import time
    import threading
    import secrets
    import subprocess

    from flask import Flask, request, Response
    import Quartz

    app = Flask(__name__)

    TOKEN = os.environ["CONTROL_TOKEN"]
    SCREEN = "/tmp/maccontrol-screen.png"

    # macOS virtual key codes (US keyboard layout).
    KEY_CODES = {
        "KeyA": 0, "KeyS": 1, "KeyD": 2, "KeyF": 3,
        "KeyH": 4, "KeyG": 5, "KeyZ": 6, "KeyX": 7,
        "KeyC": 8, "KeyV": 9, "KeyB": 11, "KeyQ": 12,
        "KeyW": 13, "KeyE": 14, "KeyR": 15, "KeyY": 16,
        "KeyT": 17, "Digit1": 18, "Digit2": 19,
        "Digit3": 20, "Digit4": 21, "Digit6": 22,
        "Digit5": 23, "Equal": 24, "Digit9": 25,
        "Digit7": 26, "Minus": 27, "Digit8": 28,
        "Digit0": 29, "BracketRight": 30, "KeyO": 31,
        "KeyU": 32, "BracketLeft": 33, "KeyI": 34,
        "KeyP": 35, "KeyL": 37, "KeyJ": 38,
        "Quote": 39, "KeyK": 40, "Semicolon": 41,
        "Backslash": 42, "Comma": 43, "Slash": 44,
        "KeyN": 45, "KeyM": 46, "Period": 47,
        "Tab": 48, "Space": 49, "Backquote": 50,
        "Backspace": 51, "Escape": 53,
        "MetaRight": 54, "MetaLeft": 55,
        "ShiftLeft": 56, "CapsLock": 57, "AltLeft": 58,
        "ControlLeft": 59, "ShiftRight": 60,
        "AltRight": 61, "ControlRight": 62,
        "Enter": 36, "NumpadEnter": 76,
        "NumpadDecimal": 65, "NumpadMultiply": 67,
        "NumpadAdd": 69, "NumpadDivide": 75,
        "NumpadSubtract": 78, "NumpadEqual": 81,
        "Numpad0": 82, "Numpad1": 83, "Numpad2": 84,
        "Numpad3": 85, "Numpad4": 86, "Numpad5": 87,
        "Numpad6": 88, "Numpad7": 89, "Numpad8": 91,
        "Numpad9": 92, "F5": 96, "F6": 97, "F7": 98,
        "F3": 99, "F8": 100, "F9": 101, "F11": 103,
        "F13": 105, "F16": 106, "F14": 107, "F10": 109,
        "F12": 111, "F15": 113, "Help": 114, "Home": 115,
        "PageUp": 116, "ForwardDelete": 117, "F4": 118,
        "End": 119, "F2": 120, "PageDown": 121, "F1": 122,
        "ArrowLeft": 123, "ArrowRight": 124,
        "ArrowDown": 125, "ArrowUp": 126,
    }

    MODIFIER_FLAGS = {
        "shift": Quartz.kCGEventFlagMaskShift,
        "ctrl": Quartz.kCGEventFlagMaskControl,
        "alt": Quartz.kCGEventFlagMaskAlternate,
        "meta": Quartz.kCGEventFlagMaskCommand,
    }

    def authorized():
        supplied = request.args.get("token", "")
        return bool(TOKEN) and secrets.compare_digest(supplied, TOKEN)

    def screenshot_loop():
        while True:
            try:
                subprocess.run(
                    ["/usr/sbin/screencapture", "-x", SCREEN],
                    stdout=subprocess.DEVNULL,
                    stderr=subprocess.DEVNULL,
                    timeout=5,
                )
            except Exception:
                pass
            time.sleep(0.5)

    def click(x, y):
        point = Quartz.CGPoint(float(x), float(y))
        for event_type in (
            Quartz.kCGEventLeftMouseDown,
            Quartz.kCGEventLeftMouseUp,
        ):
            event = Quartz.CGEventCreateMouseEvent(
                None, event_type, point, Quartz.kCGMouseButtonLeft
            )
            Quartz.CGEventPost(Quartz.kCGHIDEventTap, event)

    def type_text(text):
        for char in text[:5000]:
            event = Quartz.CGEventCreateKeyboardEvent(None, 0, True)
            Quartz.CGEventKeyboardSetUnicodeString(event, len(char), char)
            Quartz.CGEventPost(Quartz.kCGHIDEventTap, event)

            event = Quartz.CGEventCreateKeyboardEvent(None, 0, False)
            Quartz.CGEventKeyboardSetUnicodeString(event, len(char), char)
            Quartz.CGEventPost(Quartz.kCGHIDEventTap, event)

    @app.route("/")
    def index():
        if not authorized():
            return "Unauthorized", 401

        return """
    <!doctype html>
    <html>
    <head>
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <title>macOS Control</title>
      <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; background: #111; color: white;
          font-family: Arial, sans-serif; }
        #bar { min-height: 50px; display: flex; flex-wrap: wrap;
          align-items: center; gap: 8px; padding: 8px; background: #222; }
        #text { flex: 1; min-width: 100px; background: #333; color: white;
          border: 1px solid #555; padding: 8px; }
        button { padding: 8px 12px; }
        #screen { display: block; max-width: 100%; max-height: calc(100vh - 65px);
          margin: auto; object-fit: contain; user-select: none; }
      </style>
    </head>
    <body>
      <div id="bar">
        <b>macOS</b>
        <input id="text" placeholder="Type text, then press Enter">
        <button id="send">Type</button>
        <span id="status">Connecting...</span>
      </div>
      <img id="screen" draggable="false" alt="Remote screen">
      <script>
        const token = new URLSearchParams(location.search).get("token") || "";
        const img = document.getElementById("screen");
        const status = document.getElementById("status");
        const textInput = document.getElementById("text");

        let keyQueue = Promise.resolve();
        let refreshBusy = false;
        const heldKeys = new Set();

        async function api(path, payload) {
          const response = await fetch(
            path + "?token=" + encodeURIComponent(token),
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            }
          );
          if (!response.ok) throw new Error("HTTP " + response.status);
        }

        function queueKey(payload) {
          keyQueue = keyQueue.then(() => api("/key", payload))
            .catch(error => {
              status.textContent = "Keyboard error";
              console.error(error);
            });
          return keyQueue;
        }

        async function refresh() {
          if (refreshBusy) return;
          refreshBusy = true;
          try {
            const response = await fetch(
              "/screen?token=" + encodeURIComponent(token) + "&t=" + Date.now(),
              { cache: "no-store" }
            );
            if (!response.ok) throw new Error("Screen unavailable");
            const blob = await response.blob();
            const next = URL.createObjectURL(blob);
            const old = img.src;
            img.src = next;
            if (old.startsWith("blob:")) URL.revokeObjectURL(old);
            status.textContent = "Connected";
          } catch (_) {
            status.textContent = "Screen unavailable";
          } finally {
            refreshBusy = false;
          }
        }

        setInterval(refresh, 500);
        refresh();

        img.addEventListener("click", async event => {
          const rect = img.getBoundingClientRect();
          const x = (event.clientX - rect.left) * img.naturalWidth / rect.width;
          const y = (event.clientY - rect.top) * img.naturalHeight / rect.height;
          try {
            await api("/click", { x, y });
          } catch (_) {
            status.textContent = "Click failed";
          }
        });

        async function sendText() {
          const value = textInput.value;
          if (!value) return;
          try {
            await api("/type", { text: value });
            textInput.value = "";
          } catch (_) {
            status.textContent = "Text input failed";
          }
        }

        document.getElementById("send").addEventListener("click", sendText);

        // Enter in the text field sends the entered text.
        textInput.addEventListener("keydown", event => {
          if (event.key === "Enter") {
            event.preventDefault();
            sendText();
          }
        });

        document.addEventListener("keydown", event => {
          if (event.target.closest("input, textarea, select")) return;
          if (event.repeat) {
            event.preventDefault();
            return;
          }
          event.preventDefault();
          heldKeys.add(event.code);
          queueKey({
            code: event.code,
            down: true,
            modifiers: {
              shift: event.shiftKey,
              ctrl: event.ctrlKey,
              alt: event.altKey,
              meta: event.metaKey
            }
          });
        }, true);

        document.addEventListener("keyup", event => {
          if (event.target.closest("input, textarea, select")) return;
          event.preventDefault();
          heldKeys.delete(event.code);
          queueKey({
            code: event.code,
            down: false,
            modifiers: {
              shift: event.shiftKey,
              ctrl: event.ctrlKey,
              alt: event.altKey,
              meta: event.metaKey
            }
          });
        }, true);

        window.addEventListener("blur", () => {
          for (const code of heldKeys) {
            queueKey({
              code,
              down: false,
              modifiers: { shift: false, ctrl: false, alt: false, meta: false }
            });
          }
          heldKeys.clear();
        });
      </script>
    </body>
    </html>
    """

    @app.route("/screen")
    def screen():
        if not authorized():
            return "Unauthorized", 401
        try:
            with open(SCREEN, "rb") as f:
                data = f.read()
            return Response(data, mimetype="image/png",
                            headers={"Cache-Control": "no-store"})
        except FileNotFoundError:
            return "No screenshot", 503

    @app.route("/click", methods=["POST"])
    def click_route():
        if not authorized():
            return "Unauthorized", 401
        data = request.get_json(silent=True) or {}
        try:
            click(data["x"], data["y"])
        except (KeyError, TypeError, ValueError):
            return "Invalid coordinates", 400
        return "OK"

    @app.route("/type", methods=["POST"])
    def type_route():
        if not authorized():
            return "Unauthorized", 401
        data = request.get_json(silent=True) or {}
        text = data.get("text", "")
        if not isinstance(text, str):
            return "Invalid text", 400
        type_text(text)
        return "OK"

    @app.route("/key", methods=["POST"])
    def key_route():
        if not authorized():
            return "Unauthorized", 401

        data = request.get_json(silent=True) or {}
        code = data.get("code")
        down = data.get("down")
        modifiers = data.get("modifiers", {})

        if not isinstance(code, str) or len(code) > 40:
            return "Invalid key", 400
        if not isinstance(down, bool):
            return "Invalid key state", 400
        if not isinstance(modifiers, dict):
            return "Invalid modifiers", 400

        keycode = KEY_CODES.get(code)
        if keycode is None:
            return "Unsupported key", 400

        flags = 0
        for name, flag in MODIFIER_FLAGS.items():
            if modifiers.get(name) is True:
                flags |= flag

        event = Quartz.CGEventCreateKeyboardEvent(None, keycode, down)
        Quartz.CGEventSetFlags(event, flags)
        Quartz.CGEventPost(Quartz.kCGHIDEventTap, event)
        return "OK"

    threading.Thread(target=screenshot_loop, daemon=True).start()

    app.run(host="127.0.0.1", port=8080, threaded=True)
    PYTHON

    echo "=== Check Python syntax ==="
    python -m py_compile server.py

    TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
    export CONTROL_TOKEN="$TOKEN"

    echo "=== Start Flask server ==="
    python server.py > "$HOME/maccontrol/server.log" 2>&1 &
    SERVER_PID=$!

    cleanup() {
      kill "$SERVER_PID" "${TUNNEL_PID:-}" 2>/dev/null || true
    }
    trap cleanup EXIT INT TERM

    sleep 3
    if ! kill -0 "$SERVER_PID" 2>/dev/null; then
      cat "$HOME/maccontrol/server.log"
      exit 1
    fi

    echo "=== Check screenshot ==="
    /usr/sbin/screencapture -x /tmp/test.png || true
    if [ -f /tmp/test.png ]; then
      sips -g pixelWidth -g pixelHeight /tmp/test.png || true
    else
      echo "WARNING: Screenshot unavailable in this hosted session."
    fi

    echo "=== Install cloudflared for detected architecture ==="
    mkdir -p "$HOME/cloudflared"
    ARCH="$(uname -m)"
    case "$ARCH" in
      arm64) CF_ARCH="arm64" ;;
      x86_64) CF_ARCH="amd64" ;;
      *)
        echo "Unsupported architecture: $ARCH"
        exit 1
        ;;
    esac

    curl -fsSL --retry 3 \
      "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-${CF_ARCH}.tgz" \
      -o "$HOME/cloudflared.tgz"

    tar -xzf "$HOME/cloudflared.tgz" -C "$HOME/cloudflared"
    chmod +x "$HOME/cloudflared/cloudflared"

    echo "=== Start Cloudflare tunnel ==="
    "$HOME/cloudflared/cloudflared" tunnel --no-autoupdate \
      --url http://127.0.0.1:8080 \
      > "$HOME/cloudflared.log" 2>&1 &
    TUNNEL_PID=$!

    URL=""
    for i in $(seq 1 60); do
      URL="$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
        "$HOME/cloudflared.log" | head -1 || true)"
      if [ -n "$URL" ]; then break; fi
      if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
        cat "$HOME/cloudflared.log"
        exit 1
      fi
      sleep 2
    done

    if [ -z "$URL" ]; then
      echo "Tunnel URL not found."
      cat "$HOME/cloudflared.log"
      exit 1
    fi

    echo
    echo "Remote desktop URL:"
    echo "${URL}/?token=${TOKEN}"
    echo
    echo "Keep this URL private; anyone with it may control the session."

    while kill -0 "$SERVER_PID" 2>/dev/null &&
          kill -0 "$TUNNEL_PID" 2>/dev/null; do
      sleep 10
    done

    echo "Server or tunnel stopped."
    cat "$HOME/maccontrol/server.log"
    cat "$HOME/cloudflared.log"
    exit 1

  displayName: 'Start browser-controlled macOS desktop'
  timeoutInMinutes: 10080
